# Configuración de pytest (Acuse no se publica como paquete: no hay pyproject.toml).
[pytest]
testpaths = tests
# La raíz del repo en sys.path: el CI corre `pytest` (no `python -m pytest`, que agrega el directorio actual) y
# Acuse no se instala como paquete, así que sin esto `import acuse` falla al recolectar.
pythonpath = .
addopts = -ra --strict-markers
markers =
    e2e: arranca la API como proceso (uvicorn) y la recorre por HTTP
