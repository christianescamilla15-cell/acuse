# ruff: la misma configuración en local y en el CI (no depende de la del equipo de quien lo corre).
target-version = "py312"
line-length = 120
extend-exclude = [".venv-calidad"]

[lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
  "B008",   # Body()/Query() en los valores por omisión es el idioma de FastAPI
  "UP042",  # (str, Enum) → StrEnum cambia str() de los miembros que SQLAlchemy guarda: no es cosmético
  "UP017",  # timezone.utc se queda: es lo que se lee en todo el modelo y en la documentación
]

[lint.isort]
known-first-party = ["acuse"]
known-local-folder = ["apoyo"]   # módulo de apoyo de tests/ (pytest lo pone en sys.path)
