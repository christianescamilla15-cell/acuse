# CI (N02, N03, N07, N08, N08b, N09): pruebas por regla, integración contra SQLite en archivo, E2E contra el
# proceso, paridad contra los golden del oráculo independiente, contrato OpenAPI al día y la imagen de producción
# construida y ARRANCADA. Plantilla común del portafolio adaptada a Acuse (Python 3.12, FastAPI, SQLite; el tablero
# web/ es JavaScript sin compilación).
#
# Un job «skipped» por depender de otro en rojo NO es verde: en la rama protegida (main) todos los jobs de este
# flujo y los de seguridad.yml son checks requeridos (.github/rulesets/main.json).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: pruebas (Python 3.12 · SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: estilo (ruff, configuración del repo)
        run: ruff check .
      - name: sintaxis del tablero (web/app.js)
        run: node --check web/app.js
      # pytest sale con 5 si no encontró pruebas: eso ya falla. La cobertura se reporta, no es la compuerta; la
      # compuerta es docs/reglas.md (una prueba por regla, verificada por tests/test_reglas_doc.py), la paridad
      # golden con sus controles negativos y el contrato. Incluye la E2E (uvicorn como proceso) y Schemathesis.
      - run: pytest -q --junitxml=reporte.xml --cov --cov-report=xml --cov-report=term
      - run: python3 herramientas/verificar_reportes.py pytest reporte.xml
      - name: golden y contrato al día (también lo exigen las pruebas)
        run: |
          python tests/golden/generar_golden.py --revisar
          python herramientas/exportar_openapi.py --revisar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: pruebas
          path: |
            reporte.xml
            coverage.xml

  # La imagen es lo que se entrega (README: docker build / docker run; no hay despliegue en la nube, ver RUNBOOK.md).
  # Lección de Verificarro (19-nov): el CI probaba en 3.12 y la imagen traía 3.10; todo salía en verde.
  imagen:
    name: imagen de producción (construcción y arranque)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: construir la imagen (el mismo Dockerfile del README)
        run: docker build -t acuse:ci .
      - name: el Python de la imagen es el mismo que prueba el CI
        run: >-
          docker run --rm --entrypoint python3 acuse:ci
          -c "import sys; v = sys.version_info[:2]; print('Python de la imagen:', sys.version);
          assert v == (3, 12), f'la imagen trae {v}, el CI prueba 3.12'"
      - name: no corre como root y no trae herramientas de pruebas
        run: |
          test "$(docker run --rm --entrypoint id acuse:ci -u)" != "0"
          if docker run --rm --entrypoint python3 acuse:ci -c "import pytest" 2>/dev/null; then
            echo "::error::la imagen de producción trae pytest (requirements-dev.txt no debe instalarse ahí)"
            exit 1
          fi
      - name: arrancar como en el README y correr la prueba de humo
        run: |
          docker run -d --name acuse -p 8000:8000 acuse:ci
          herramientas/humo.sh http://localhost:8000
      - name: el HEALTHCHECK de la imagen llega a «healthy»
        run: |
          for i in $(seq 1 45); do
            estado="$(docker inspect --format '{{.State.Health.Status}}' acuse)"
            echo "salud del contenedor: ${estado}"
            [ "$estado" = "healthy" ] && exit 0
            sleep 2
          done
          exit 1
      - name: con ACUSE_BD en archivo, el histórico sobrevive al reinicio del contenedor
        run: |
          docker run -d --name acuse-archivo -p 8001:8000 -e ACUSE_BD=sqlite+pysqlite:////tmp/acuse.db acuse:ci
          herramientas/humo.sh http://localhost:8001
          curl -fsS -X POST -H 'Content-Type: application/json' -d '{"n": 3}' http://localhost:8001/api/simular/corrida
          antes="$(curl -fsS http://localhost:8001/api/resumen | python3 -c 'import json,sys; print(json.load(sys.stdin)["total"])')"
          docker restart acuse-archivo
          herramientas/humo.sh http://localhost:8001
          despues="$(curl -fsS http://localhost:8001/api/resumen | python3 -c 'import json,sys; print(json.load(sys.stdin)["total"])')"
          echo "entregas antes=${antes} después=${despues}"
          test "$antes" = "$despues"
      - name: bitácoras si algo falló
        if: failure()
        run: |
          docker logs acuse 2>&1 | tail -80 || true
          docker logs acuse-archivo 2>&1 | tail -80 || true
